version: "3"

services:
  odoo:
    container_name: "odoo_${PROJECT_TITLE}"
    working_dir: /var/lib/odoo
    depends_on:
      - db
    image: odoo:19.0-20250918
    ports:
      - 8069:8069
    # Use this line to include enterprise addons
    # command: ['odoo', '--addons-path=/var/lib/odoo/enterprise', "-d", "${DB_TABLE}" , "-r", "${DB_USER}", "-w", "${DB_PASSWORD}", "-i", "base,web", "--dev", "xml"] 
    command: ['odoo', '--addons-path=', "-d", "${DB_TABLE}" , "-r", "${DB_USER}", "-w", "${DB_PASSWORD}", "-i", "base,web", "--dev", "xml"]
    volumes:
      # - ./${ODOO_ENTERPRISE_LOCAL_PATH}:/var/lib/odoo/enterprise # Uncomment this line to include enterprise addons
      - ./addons:/var/lib/odoo/addons:rw
      - ./extra-addons:/mnt/extra-addons:rw
      - ./config:/etc/odoo:rw
      - ./odoo-logs:/etc/odoo-logs:rw
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_TABLE}

  db:
    container_name: "db_${PROJECT_TITLE}"
    image: postgres:13-alpine
    ports:
      - 5432:5432
    environment:
      - POSTGRES_DB=${DB_TABLE}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_USER=${DB_USER}
    volumes:
      - ./odoo-db-data:/var/lib/postgresql/data
    restart: always